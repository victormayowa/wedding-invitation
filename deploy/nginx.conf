# The server's own nginx in front of the wedding site (PROXY=nginx, the default).
# One-time setup on the server, as root:
#
#   1. Save this file as /etc/nginx/sites-available/victoradaezenewine.duckdns.org
#      (change the domain throughout if yours differs), without the 443 server block
#      at first, since its certificate doesn't exist yet. Then:
#        ln -s /etc/nginx/sites-available/victoradaezenewine.duckdns.org /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#   2. Get the certificate; certbot renews it on its own and reloads nginx afterwards:
#        certbot certonly --nginx -d victoradaezenewine.duckdns.org --deploy-hook "systemctl reload nginx"
#   3. Add the 443 server block back, then: nginx -t && systemctl reload nginx
#
# The site itself listens on 127.0.0.1:3100 (APP_PORT), never on a public port.

server {
    listen 80;
    server_name victoradaezenewine.duckdns.org;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name victoradaezenewine.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/victoradaezenewine.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/victoradaezenewine.duckdns.org/privkey.pem;

    client_max_body_size 2m;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
